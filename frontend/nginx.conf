server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # batch detail pages are client-side rendered (batch UUID in the path)
    location /batches/ {
        try_files $uri /batch.html;
    }

    # back-end API; same-origin for the UI, so no CORS is needed.
    # `backend` is the compose service name (Docker DNS).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # uploads may be up to JENNIT_MAX_UPLOAD_BYTES (2 GiB by default);
        # the back-end enforces the actual limit
        client_max_body_size 0;
        # stream large uploads straight to the back-end
        proxy_request_buffering off;
        client_body_timeout 900s;
        send_timeout 900s;
        proxy_connect_timeout 30s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }
}
